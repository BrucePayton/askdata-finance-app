[project]
name = "askdata-finance-app"
version = "2.0.0"
description = "Finance application package for an AskData-compatible platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1,<2",
  "pymysql>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "mcp>=1.9,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
