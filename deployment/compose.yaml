name: askdata-finance-app

services:
  finance-web:
    image: ${FINANCE_WEB_IMAGE:?set FINANCE_WEB_IMAGE}
    build:
      context: ../frontend
      args:
        FINANCE_WEB_BASE: /finance/
    restart: unless-stopped
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O- http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  finance-edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${FINANCE_HTTP_BIND:-127.0.0.1}:${FINANCE_HTTP_PORT:-18081}:80"
    environment:
      PLATFORM_API_URL: ${PLATFORM_API_URL:?set PLATFORM_API_URL}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks: [app]
    depends_on:
      finance-web:
        condition: service_healthy

networks:
  app: {}
